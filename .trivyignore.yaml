# Trivy exceptions (AOS-622). Each entry needs a statement (why it is safe or unfixable) and expired_at.
# vulnerabilities:
#   - id: CVE-0000-00000
#     statement: "not reachable: …"
#     expired_at: 2026-12-31
vulnerabilities:
  # PENDING OWNER SIGN-OFF (AOS-717, D-100): not accepted by Pragun yet; the PR must not merge until he does.
  # libxml2 arrives in the pdf-parser image only as a dependency of
  # libarchive, which libtesseract links to read packed language data. The parser never parses XML: Tesseract gets a
  # PNG that Pillow re-encoded, on stdin, and its language data from the image's read-only files. Debian has no fixed
  # libxml2 yet ("affected"). Re-check when Debian ships a fix, or by the expiry.
  - id: CVE-2026-6653
    statement: "not reachable: no XML is parsed in pdf-parser; libxml2 is only linked through libarchive (Tesseract's language-data loader)"
    expired_at: 2026-12-31
