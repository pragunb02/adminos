services:
  postgres:
    image: postgres:18.6-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: adminos
      POSTGRES_USER: adminos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql  # Postgres 18+ layout (PGDATA=/var/lib/postgresql/18/docker)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-server:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pdf-parser:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/adminos
      DB_USER: adminos
      DB_PASSWORD: ${DB_PASSWORD:?}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 48)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:8080}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      GOOGLE_PUBSUB_AUDIENCE: ${GOOGLE_PUBSUB_AUDIENCE:-}
      GOOGLE_PUBSUB_SERVICE_ACCOUNT: ${GOOGLE_PUBSUB_SERVICE_ACCOUNT:-}
      GOOGLE_GMAIL_PUBSUB_TOPIC: ${GOOGLE_GMAIL_PUBSUB_TOPIC:-}
      GOOGLE_GMAIL_PUBSUB_SUBSCRIPTION: ${GOOGLE_GMAIL_PUBSUB_SUBSCRIPTION:-}
      PORT: "8080"
      BIND_HOST: "0.0.0.0"   # inside the container only; the host publish above is 127.0.0.1
      STATEMENT_PARSER_URL: http://pdf-parser:8000
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_ZONE: ${SCHEDULER_ZONE:-Asia/Kolkata}

  gmail-worker:
    profiles: ["full"]
    build:
      context: ./services/workers
      dockerfile: Dockerfile
    command: ["--type=gmail"]
    depends_on:
      api-server:
        condition: service_healthy   # the API runs the DB migrations (D-12)
      redis:
        condition: service_healthy
    environment:
      # Password via the standard libpq/pgx variable, so no URL carries a credential.
      DATABASE_URL: postgresql://adminos@postgres:5432/adminos
      PGPASSWORD: ${DB_PASSWORD:?}
      REDIS_URL: redis://redis:6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}

  agent-runner:
    profiles: ["full"]
    build:
      context: ./services/workers
      dockerfile: Dockerfile
    command: ["--type=agent"]
    depends_on:
      api-server:
        condition: service_healthy   # the API runs the DB migrations (D-12)
      redis:
        condition: service_healthy
    environment:
      # Password via the standard libpq/pgx variable, so no URL carries a credential.
      DATABASE_URL: postgresql://adminos@postgres:5432/adminos
      PGPASSWORD: ${DB_PASSWORD:?}
      REDIS_URL: redis://redis:6379
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}

  pdf-parser:
    # Statement parser (D-37): stateless, internal network only (no published port). The API calls it.
    build:
      context: ./services/pdf-parser
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web-app:
    profiles: ["full"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://api-server:8080      # same-origin proxy target (D-32)
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api-server:
        condition: service_healthy

volumes:
  postgres_data:
